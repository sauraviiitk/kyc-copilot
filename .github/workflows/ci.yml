name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Lint
        run: python -m ruff check app tests
        working-directory: backend
      - name: Test
        run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Frontend (vitest + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint / typecheck
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm run test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  evaluation:
    name: Evaluation harness (v1 vs v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run real evaluation
        run: python -m app.evaluation.cli run --versions v1,v2 --label "CI baseline"
        working-directory: backend
        env:
          LLM_PROVIDER: mock
          POLICY_BACKEND: local
          MOCK_MANDATE_FAILURE_RATE: "0"
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
          if-no-files-found: error
