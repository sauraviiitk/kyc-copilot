name: kyc-copilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
      POSTGRES_DB: kyc_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d kyc_copilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-please-32}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      # Compose defaults to the bundled Postgres. Point DATABASE_URL at your
      # Supabase pooler URL to use Supabase instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://kyc:kyc@postgres:5432/kyc_copilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      POLICY_BACKEND: ${POLICY_BACKEND:-auto}
      CHROMA_DIR: /app/data/chroma
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      MOCK_MANDATE_FAILURE_RATE: ${MOCK_MANDATE_FAILURE_RATE:-0.2}
      MOCK_SEED: ${MOCK_SEED:-kyc-copilot}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVALS_DIR: /evals/scenarios
      EVALS_REPORTS_DIR: /evals/reports
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data
      - ./evals:/evals:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # One-shot evaluation runner. `docker compose run --rm eval`
  eval:
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://kyc:kyc@postgres:5432/kyc_copilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-please-32}
      POLICY_BACKEND: ${POLICY_BACKEND:-auto}
      CHROMA_DIR: /app/data/chroma
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MOCK_SEED: ${MOCK_SEED:-kyc-copilot}
      EVALS_DIR: /evals/scenarios
      EVALS_REPORTS_DIR: /evals/reports
    volumes:
      - appdata:/app/data
      - ./evals:/evals
    command: ["python", "-m", "app.evaluation.cli", "run", "--versions", "v1,v2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  appdata:
